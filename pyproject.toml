[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leanlean"
version = "0.1.0"
description = "Benchmark and preprocessing tools for Lean proof compression."
readme = "README.md"
authors = [
    { name = "Kári Rögnvaldsson" },
    { name = "Niels Mündler-Sasahara" },
    { name = "Jasper Dekoninck" },
    { name = "Martin Vechev" },
]
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1",
    "litellm>=1.96.2",
    "openai>=1.0.0",
    "rich>=13.0",
    "fire",
    "litellm[proxy]>=1.96.2",
    "jsonlines",
    "streamlit>=1.54.0",
    "tabulate>=0.9.0",
    "tqdm>=4.67.1",
    "requests>=2.32.5",
    "pyyaml>=6.0.3",
    "pytest>=9.0.2",
    "pandas>=2.3.3",
    "google-genai>=2.8.0",
    "matplotlib>=3.10",
    "networkx>=3.4",
    # Preprocessing engine: lean-strip v1.0.0 (tag v1.0.0), pinned by commit.
    "lean-strip @ git+https://github.com/eth-sri/lean-strip@cbca97147bc4763dd2a5b27a923d3a122d3af39e",
]

[project.optional-dependencies]
# Lightweight local run monitor (no Streamlit or frontend build required).
dashboard = ["psutil>=5.9", "ijson>=3.2"]
# Local model serving (host-side only). Heavy: pulls torch + CUDA. Install with
#   uv sync --extra serve
# then launch e.g. `bash local_lms/vllm_qwen_9b.sh localhost 4002`.
serve = [
    "vllm>=0.11.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.package-data]
"leanlean.run_monitor" = ["static/*"]
