  task_prompt:
    path: experiments/reconstruction/leanlean-refactoring-ablation-reproof/reproving-ablation-lean-verify-prompt.txt
  native_instructions:
    path: experiments/reconstruction/leanlean-refactoring-ablation-reproof/reproving-ablation-native-instructions.json
