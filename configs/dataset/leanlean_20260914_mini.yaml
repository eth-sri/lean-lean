# LeanLean Mini subset of the balanced 2026-09-14 preprocessing-v25 dataset.
kind: leanlean_evaluation_dataset
schema_version: 1

dataset: datasets/leanlean_20260914/dataset.yaml
repositories:
  - palomar__2026-08-19-000003
  - palomar__2026-08-27-000011
  - palomar__2026-08-23-000003
  - palomar__2026-08-22-000006
  - palomar__2026-08-21-000004
  - palomar__2026-08-24-000002
  - palomar__2026-08-22-000003
  - palomar__2026-08-26-000006
  - palomar__2026-08-17-000003
  - palomar__2026-08-24-000005
  - palomar__2026-08-17-000002
  - palomar__2026-08-29-000003
rounds: 1
max_api_retries: 0

agent:
  system_prompt: native
  prompt: |-
    Refactor the proofs in this codebase.
    Remove all dead code and do real simplification, i.e. use powerful tactics or factor out shared logic to simplify the code while preserving the main results.
    Success is measured by three factors:

    (1) The repo compiling without errors and relying only on standard axioms.
    (2) The benchmark's protected main results compile and remain equivalent. Run the no-argument command `lean_verify` from the repository root to verify the signatures, exit code 0 means the main results are preserved according to the lean comparator.
    (3) The scoring metric is the reduction in non-whitespace, non-comment "Lean tokens" across all .lean files, compared to the starting state. Compressing imports does not count towards the compression metric. Run python3 proof_length.py to measure it.

    You are working in a Docker container that is limited to {container_cpus} CPUs and {container_memory} of RAM.

    You have a wall-clock budget of {time_limit}. It started at {current_time} and expires at {deadline}.

    When you believe there is no more refactoring to be done, output <submit> and terminate.
  allowed_skills: []
  mcp_servers: []
  enable_subagents: false
  enable_lean_verify: true
  enable_proof_length: true

container:
  cpus: 8
  build_jobs: 8
  memory: 64g
  max_total_memory: 384g
  pids_limit: 4096
  timeout: 12h
  cgroup_parent: lean.slice
  network_policy: model_proxy_only

monitoring:
  snapshots: true
  every_n_edits: 1
  reconciliation_interval_seconds: 30

postprocessing:
  replay: true
  workers: 6
  threads_per_repository: 8
