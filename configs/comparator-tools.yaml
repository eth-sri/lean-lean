# Pinned Palomar Comparator tool bundle.
#
# Every repository's verification contract (its Palomar registry record) names
# the Comparator, lean4export, Landrun and nanoda commits the registry verified
# it with. This file lists exactly the commits the 64 LeanLean 2026-09-14
# repositories (and the four-repository demo, a subset) use, how each is built,
# and where it lands in the bundle that `leanlean.palomar_comparator` loads
# (its TOOL_BUNDLE, .cache/palomar-comparator/bundle):
#
#   <bundle>/bin/landrun
#   <bundle>/bin/nanoda_bin
#   <bundle>/comparator/<commit>/comparator
#   <bundle>/lean4export/<commit>/lean4export
#
# `scripts/build_comparator_bundle.py` reads this file, fetches each commit from
# its public upstream, builds it in Docker, installs it at that path and records
# the result in <bundle>/tools-manifest.json.
#
# The recipes follow the registry's own verifier workflow
# (PalomarRegistry/PalomarSubmission, .github/workflows/submission.yml at
# c605f23466450a52999fcfb3c6d68ed8febc56bf): `CGO_ENABLED=0` Go 1.24.0 for
# Landrun (with -trimpath and an empty build ID), `cargo build --release --locked` for nanoda, `lake build comparator`
# under the Comparator checkout's own lean-toolchain, and `lake build
# lean4export` under the repository's Lean toolchain.
#
# sha256 is the binary every pin was verified with. These builds are
# bit-for-bit reproducible, so the builder checks each result against it.
schema: leanlean_comparator_tools_v1

images:
  go: golang:1.24.0@sha256:3f7444391c51a11a039bf0359ee81cc64e663c17d787ad0e637a4de1a3f62a71
  rust: rust:1.85.1@sha256:e51d0265072d2d9d5d320f6a44dde6b9ef13653b035098febd68cce8fa7c0bc4
  # Lean toolchains ship their own clang and glibc sysroot; the image only
  # supplies git and curl for elan and Lake.
  lean: buildpack-deps:bookworm-scm@sha256:b42f74a50a22540b839042134919504ff7c51e7cf8d751b79d0f94c56566cb92

elan:
  version: v4.2.3
  url: https://github.com/leanprover/elan/releases/download/v4.2.3/elan-x86_64-unknown-linux-gnu.tar.gz
  sha256: df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2

tools:
  landrun:
    repository: https://github.com/zouuup/landrun.git
    builder: go
    commits:
      811cfff51ceaf3d9843708aa6d22e9b84ccac8b4:
        toolchain: go1.24.0
        sha256: 416d9b8a71c66b075fea79a1e29ebc65af761b91bfb8deeb40ac800444bbd604
        used_by: all

  nanoda:
    # The registry workflow builds the robsimmons mirror; the same commit is
    # also on ammkrn/nanoda_lib, the repository Comparator's README names.
    repository: https://github.com/robsimmons/nanoda_lib.git
    builder: rust
    commits:
      68d5ca9db226849b41a6fff59d796ff19d0a8840:
